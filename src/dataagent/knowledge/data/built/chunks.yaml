- id: usage_sec::definition
  kind: definition
  metric_id: usage_sec
  text: 使用时长（秒）：统计周期内全站用户停留时长之和，含视频、直播、社区
- id: usage_sec::dimension
  kind: dimension
  metric_id: usage_sec
  text: 使用时长 支持维度：date、platform
- id: usage_sec::formula
  kind: formula
  metric_id: usage_sec
  text: 使用时长 的计算方式：sum(usage_sec)，来源表 dws_user_daily
- id: valid_play_cnt::caveat
  kind: caveat
  metric_id: valid_play_cnt
  text: 有效播放次数 口径注意：30 秒阈值由消费组维护，改动需走口径变更流程
- id: valid_play_cnt::confusable
  kind: confusable
  metric_id: valid_play_cnt
  text: 有效播放次数 易混指标：完播次数
- id: valid_play_cnt::definition
  kind: definition
  metric_id: valid_play_cnt
  text: 有效播放次数（次）：统计周期内播放时长达到 30 秒以上的播放次数
- id: valid_play_cnt::dimension
  kind: dimension
  metric_id: valid_play_cnt
  text: 有效播放次数 支持维度：date、category、platform
- id: valid_play_cnt::formula
  kind: formula
  metric_id: valid_play_cnt
  text: 有效播放次数 的计算方式：sum(valid_play_cnt)，来源表 dws_video_daily
- id: valid_play_rate::caveat
  kind: caveat
  metric_id: valid_play_rate
  text: 有效播放率 口径注意：阈值 30 秒由消费组定义，改动需走口径变更流程
- id: valid_play_rate::confusable
  kind: confusable
  metric_id: valid_play_rate
  text: 有效播放率 易混指标：完播率
- id: valid_play_rate::definition
  kind: definition
  metric_id: valid_play_rate
  text: 有效播放率（百分比）：播放时长达到 30 秒以上的播放次数占播放次数的比例
- id: valid_play_rate::dimension
  kind: dimension
  metric_id: valid_play_rate
  text: 有效播放率 支持维度：date、category、platform
- id: valid_play_rate::formula
  kind: formula
  metric_id: valid_play_rate
  text: 有效播放率 的计算方式：sum(valid_play_cnt) / sum(play_cnt)，来源表 dws_video_daily
- id: vip_open_cnt::caveat
  kind: caveat
  metric_id: vip_open_cnt
  text: 大会员开通数 口径注意：不含续费，续费单独计量
- id: vip_open_cnt::definition
  kind: definition
  metric_id: vip_open_cnt
  text: 大会员开通数（单）：统计周期内新开通大会员的订单数
- id: vip_open_cnt::dimension
  kind: dimension
  metric_id: vip_open_cnt
  text: 大会员开通数 支持维度：date、platform
- id: vip_open_cnt::formula
  kind: formula
  metric_id: vip_open_cnt
  text: 大会员开通数 的计算方式：sum(vip_open_cnt)，来源表 dws_user_daily
- id: watch_uv::caveat
  kind: caveat
  metric_id: watch_uv
  text: 播放人数 口径注意：跨天去重需走 dws_user_daily，日粒度 watch_uv 不可直接相加
- id: watch_uv::confusable
  kind: confusable
  metric_id: watch_uv
  text: 播放人数 易混指标：播放量
- id: watch_uv::definition
  kind: definition
  metric_id: watch_uv
  text: 播放人数（人）：统计周期内观看过视频的去重用户数，同一用户多次观看只计 1 人
- id: watch_uv::dimension
  kind: dimension
  metric_id: watch_uv
  text: 播放人数 支持维度：date、category、platform
- id: watch_uv::formula
  kind: formula
  metric_id: watch_uv
  text: 播放人数 的计算方式：sum(watch_uv)，来源表 dws_video_daily
